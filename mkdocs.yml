site_name: Open42 Architecture
site_description: Architecture and operations notes for Open42.
site_url: https://interfacelabs.github.io/open42/
repo_url: https://github.com/interfacelabs/open42
repo_name: interfacelabs/open42
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: blue
      accent: blue

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture/index.md
      - Runtime Boundaries: architecture/runtime-boundaries.md
      - Tenant Provisioning: architecture/tenant-provisioning.md
      - Data Model: architecture/data-model.md
  - Operations:
      - Local Development: operations/local-development.md
      - Fly Tenants: operations/fly-tenants.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

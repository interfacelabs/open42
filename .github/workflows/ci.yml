name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: ${{ matrix.edition }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [community, cloud]
    env:
      OPEN42_EDITION: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Install cloud-only dependencies
        if: matrix.edition == 'cloud'
        run: npm install --prefix packages/cloud/api --ignore-scripts

      - run: npm run typecheck:${{ matrix.edition }}
      - run: npm run lint:${{ matrix.edition }}
      - run: npm run test:${{ matrix.edition }}
      - run: npm run build:${{ matrix.edition }}

      - name: Community dependency smoke test
        if: matrix.edition == 'community'
        run: |
          npm ls stripe || true
          test ! -d node_modules/stripe
